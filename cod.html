<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Interactive Website</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
        }
        .hidden-content {
            display: none;
        }
        input[type="checkbox"]:checked ~ .hidden-content {
            display: block;
        }
    </style>
</head>
<body>
    <h1>Welcome to My Interactive HTML Page</h1>
    
    <!-- Collapsible Section -->
    <details>
        <summary>Click to Expand</summary>
        <p>This is a hidden section that appears when you click.</p>
    </details>

    <!-- Checkbox Toggle -->
    <h2>Toggle Content</h2>
    <label>
        <input type="checkbox"> Show Hidden Content
    </label>
    <div class="hidden-content">
        <p>You revealed this text using only HTML!</p>
    </div>

    <!-- Internal Navigation -->
    <h2>Jump to Section</h2>
    <a href="#section2">Go to Section 2</a>
    <br><br>
    <div style="margin-top: 100vh;"></div> <!-- Spacer to make scrolling visible -->
    
    <h2 id="section2">Section 2</h2>
    <p>You jumped to this section using an anchor link.</p>
    <a href="#top">Back to Top</a>
</body>
</html>
